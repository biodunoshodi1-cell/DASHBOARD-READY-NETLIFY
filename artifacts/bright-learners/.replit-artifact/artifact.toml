kind = "web"
previewPath = "/"
title = "Adaptive Learning Support App"
version = "1.0.0"
id = "artifacts/bright-learners"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23482

[services.development]
run = "pnpm --filter @workspace/bright-learners run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bright-learners", "run", "build" ]
serve = "static"
publicDir = "artifacts/bright-learners/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23482"
BASE_PATH = "/"
